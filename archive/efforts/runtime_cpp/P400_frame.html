<!DOCTYPE html>
<meta charset="utf-8">
<title>P400 Logic Families</title>
<style>
  body { margin: 0; background: #6ea8e0; font: 13px sans-serif; }
  .win { width: 640px; margin: 24px auto; background: #1d4e89; border: 2px solid #9bb; box-shadow: 0 8px 24px #0006; }
  .title { background: linear-gradient(#4a8fd4, #1d5aa8); color: #fff; padding: 4px 8px; font-weight: 700; }
  .pid { color: #fff; padding: 4px 8px; }
  .stage { position: relative; height: 360px; margin: 0 8px 8px; }
  .intro-tab { position: absolute; left: 150px; top: 8px; background: #1a5fb4; color: #fff; font-weight: 700; padding: 4px 18px; border-radius: 4px; z-index: 2; }
  .intro { position: absolute; left: 36px; top: 22px; right: 36px; height: 92px; background: #8a8a8a; border: 3px solid #ddd; border-radius: 6px; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; padding: 18px 24px 8px; }
  .box { position: absolute; left: 168px; top: 168px; width: 92px; height: 64px; border: 2px solid #fff; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; }
  .input { position: absolute; left: 118px; top: 190px; color: #fff; }
  .output { position: absolute; left: 268px; top: 190px; color: #fff; }
  .lead { position: absolute; left: 260px; top: 198px; width: 70px; height: 2px; background: #fff; }
  .chip { position: absolute; left: 336px; top: 168px; width: 150px; height: 48px; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .pin { position: absolute; width: 6px; height: 12px; background: #eee; }
  .nav { position: absolute; bottom: 6px; width: 22px; height: 18px; background: #d7d7d7; border: 1px solid #fff; color: #234; text-align: center; }
  .back { left: 4px; }
  .next { right: 4px; }
</style>
<div class="win">
  <div class="title">Nida Corporation - Logic Families</div>
  <div class="pid">P400</div>
  <div class="stage">
    <div class="intro-tab">INTRODUCTION</div>
    <div class="intro">Digital circuits and the IC chip are usually thought of as one and the same.</div>
    <div class="input">Input</div>
    <div class="box">Digital<br>Circuit</div>
    <div class="output">Output</div>
    <div class="lead"></div>
    <div class="chip">74LS174N E825</div>
    <div class="nav back">&#9664;</div>
    <div class="nav next">&#9654;</div>
  </div>
</div>
<script>
const chip = document.querySelector(".chip");
for (let i = 0; i < 8; i++) {
  for (const edge of ["top", "bottom"]) {
    const pin = document.createElement("div");
    pin.className = "pin";
    pin.style.left = (348 + i * 16) + "px";
    pin.style.top = edge === "top" ? "156px" : "216px";
    document.querySelector(".stage").appendChild(pin);
  }
}
</script>

"label":"Back","page":"P300"}],"quiz":null},{"id":"P410","text":["But, are all ICs the same? Do they all operate on the same voltages?"],"items":[{"label":"Next","page":"P420"},{"label":"Back","page":"P400"}],"quiz":null},{"id":"P420","text":["Applying 10 volts to one IC might be normal. Applying the same 10 volts to a different IC can cause damage."],"items":[{"label":"Next","page":"P430"},{"label":"Back","page":"P400"}],"quiz":null},{"id":"P430","text":["One IC might drive 4 ICs while a different IC can only drive 2 ICs.","ICs are classified into logic families based on voltage requirements, speed and the number of circuits they can drive."],"items":[{"label":"Next","page":"P450"},{"label":"Back","page":"P400"}],"quiz":null},{"id":"P450","text":["Let's begin the lesson on LOGIC FAMILIES.................................."],"items":[{"label":"Menu","page":"P900"},{"label":"Back","page":"P430"}],"quiz":null},{"id":"P900","text":["1. TTL Integrated Circuits","2. Other Integrated Circuits","3. Final Quiz","LESSON MENU"],"items":[{"label":"1. TTL Integrated Circuits","page":"P1001"},{"label":"2. Other Integrated Circuits","page":"P2001"},{"label":"3. Final Quiz","page":"P10001"},{"label":"Exit","page":"P20001"}],"quiz":null},{"id":"P1001","text":["TTL INTEGRATED CIRCUITS"],"items":[{"label":"Discussion","page":"P1040"},{"label":"Summary","page":"P1920"},{"label":"Back","page":"P20001"}],"quiz":null},{"id":"P1040","text":["Transistor-Transistor Logic (TTL) is the most widely used family of integrated circuits.","DISCUSSION"],"items":[{"label":"Next","page":"P1050"},{"label":"Back","page":"P1001"}],"quiz":null},{"id":"P1050","text":["The TTL family is divided into two basic groups."],"items":[{"label":"Next","page":"P1060"},{"label":"Back","page":"P1040"}],"quiz":null},{"id":"P1060","text":["The military group is recognized by the 5400 numbers."],"items":[{"label":"Next","page":"P1070"},{"label":"Back","page":"P1040"}],"quiz":null},{"id":"P1070","text":["The Commercial group is recognized by the 7400 numbers."],"items":[{"label":"Next","page":"P1080"},{"label":"Back","page":"P1040"}],"quiz":null},{"id":"P1080","text":["The functions performed by these two ICs are identical. However, the military's IC tolerance is more exact."],"items":[{"label":"Next","page":"P1090"},{"label":"Back","page":"P1040"}],"quiz":null},{"id":"P1082","text":["The functions performed by these two ICs are identical. However, the military's IC tolerance is more exact."],"items":[{"label":"Next","page":"P1090"},{"label":"Back","page":"P1040"}],"quiz":null},{"id":"P1085","text":["DEFINITION","TOLERANCE - The range of variation permitted or the allowable deviation from a standard."],"items":[],"quiz":null},{"id":"P1090","text":["TTL family ICs are grouped together because they all share similar characteristics."],"items":[{"label":"Next","page":"P1100"},{"label":"Back","page":"P1082"}],"quiz":null},{"id":"P1100","text":[],"items":[{"label":"Next","page":"P1110"},{"label":"Back","page":"P1090"}],"quiz":null},{"id":"P1110","text":["TTL ICs typically require input voltages between 0 and 5 volts. Voltage inputs exceeding 5 volts may damage the IC."],"items":[{"label":"Next","page":"P1120"},{"label":"Back","page":"P1090"}],"quiz":null},{"id":"P1120","text":["Output voltages produced by TTL ICs range between 0 and 5 volts. These outputs are designed to interface with other TTL Ics.m"],"items":[{"label":"Next","page":"P1130"},{"label":"Back","page":"P1110"}],"quiz":null},{"id":"P1130","text":["Another characteristic of the TTL family is the current required to operate the IC."],"items":[{"label":"Next","page":"P1140"},{"label":"Back","page":"P1120"}],"quiz":null},{"id":"P1140","text":["The \"fan-out\" of a TTL IC identifies how many other ICs can be driven from it's output."],"items":[{"label":"Next","page":"P1150"},{"label":"Back","page":"P1130"}],"quiz":null},{"id":"P1150","text":["For example, if the ICs fan-out is 5, then 5 ICs could be connected to the output of that IC."],"items":[{"label":"Next","page":"P1160"},{"label":"Back","page":"P1140"}],"quiz":null},{"id":"P1160","text":["The \"fan-in\" of a TTL IC identifies how much current it will draw when driven by an IC similar to itself."],"items":[{"label":"Next","page":"P1170"},{"label":"Back","page":"P1140"}],"quiz":null},{"id":"P1170","text":["For example, if an ICs fan-in is 1, that value is subtracted from the fan-out of the driving IC."],"items":[{"label":"Next","page":"P1180"},{"label":"Back","page":"P1140"}],"quiz":null},{"id":"P1180","text":["The remaining value of 4 identifies that the driving ICs fan-out is now 4."],"items":[{"label":"Next","page":"P1190"},{"label":"Back","page":"P1140"}],"quiz":null},{"id":"P1190","text":["Speed is an important characteristic to compare when looking at the TTL family."],"items":[{"label":"Next","page":"P1200"},{"label":"Back","page":"P1140"}],"quiz":null},{"id":"P1200","text":["Speed is also called the propagation delay of the gate."],"items":[{"label":"Next","page":"P1210"},{"label":"Back","page":"P1190"}],"quiz":null},{"id":"P1205","text":["PROPAGATION DELAY - Propagation delay is the amount of time an IC takes to switch from one condition to the other.","DEFINITION"],"items":[],"quiz":null},{"id":"P1207","text":["Speed is also called the propagation delay of the gate....."],"items":[{"label":"Next","page":"P1210"},{"label":"Back","page":"P1190"}],"quiz":null},{"id":"P1210","text":["Notice, each TTL IC shown has a letter code included with the number. The letter identifies the speed of the IC."],"items":[{"label":"Next","page":"P1220"},{"label":"Back","page":"P1207"}],"quiz":null},{"id":"P1220","text":["ICs must switch from one condition (high) to the other condition (low). The time required for switching is indicated in the letter code."],"items":[{"label":"Next","page":"P1230"},{"label":"Back","page":"P1210"}],"quiz":null},{"id":"P1230","text":["An \"L\" in the IC number identifies Low Power consumption of that chip."],"items":[{"label":"Next","page":"P1236"},{"label":"Back","page":"P1210"}],"quiz":null},{"id":"P1236","text":["However, since nothing comes for free, these chips have slower switching speeds causing Longer propagation delays..r propagation delays."],"items":[{"label":"Next","page":"P1240"},{"label":"Back","page":"P1210"}],"quiz":null},{"id":"P1240","text":["An \"H\" in the IC number identifies a High speed switching or short propagation delay."],"items":[{"label":"Next","page":"P1246"},{"label":"Back","page":"P1210"}],"quiz":null},{"id":"P1246","text":["However, to achieve these higher switching speeds, more power is consumed."],"items":[{"label":"Next","page":"P1250"},{"label":"Back","page":"P1210"}],"quiz":null},{"id":"P1250","text":["An \"S\" in the IC number identifies Schottky circuitry inside."],"items":[{"label":"Next","page":"P1256"},{"label":"Back","page":"P1210"}],"quiz":null},{"id":"P1256","text":["Schottky ICs are Super fast and consume less power than most H-type Ics."],"items":[{"label":"Next","page":"P1260"},{"label":"Back","page":"P1210"}],"quiz":null},{"id":"P1260","text":["The amount of noise an IC makes when it switches from one condition to the other is also a characteristic."],"items":[{"label":"Next","page":"P1270"},{"label":"Back","page":"P1210"}],"quiz":null},{"id":"P1270","text":["The TTL Family of ICs produce noise each time they switch from high to low, or low to high."],"items":[{"label":"Next","page":"P1280"},{"label":"Back","page":"P1260"}],"quiz":null},{"id":"P1280","text":["If too much noise is introduced by IC switching, the input or output conditions can change at the wrong time."],"items":[{"label":"Next","page":"P1290"},{"label":"Back","page":"P1270"}],"quiz":null},{"id":"P1290","text":["Which IC is part of the military group of TTL circuits?"],"items":[{"label":"Back","page":"P1270"}],"quiz":{"again":"P1292","next":"P1300","choices":[{"label":"5408","correct":true},{"label":"7400","correct":false},{"label":"7408","correct":false}]}},{"id":"P1291","text":[],"items":[],"quiz":null},{"id":"P1292","text":["The TTL family is divided into two basic groups:gative sign..............","TRY AGAIN!"],"items":[],"quiz":null},{"id":"P1300","text":["Which of these ICs is the slowest?"],"items":[{"label":"Back","page":"P1290"}],"quiz":{"again":"P1304","next":"P1310","choices":[{"label":"54L00","correct":true},{"label":"74S00","correct":false},{"label":"74H00","correct":false}]}},{"id":"P1301","text":[],"items":[],"quiz":null},{"id":"P1302","text":["The letter \"H\" in the ICs number identifies a fast switching speed or short propagation delay.","TRY AGAIN!"],"items":[],"quiz":null},{"id":"P1304","text":["The letter \"S\" in the ICs number identifies that this is a Schottky IC. Schottky ICs have a super fast switching speed.","TRY AGAIN!"],"items":[],"quiz":null},{"id":"P1310","text":["If an IC has a fan-out of 10 and a fan-in of 1, how many ICs can it drive?"],"items":[{"label":"Back","page":"P1300"}],"quiz":{"again":"P1312","next":"P1910","choices":[{"label":"1","correct":false},{"label":"11","correct":false},{"label":"10","correct":true}]}},{"id":"P1311","text":[],"items":[],"quiz":null},{"id":"P1312","text":["Fan-out identifies how many gates can be driven by the output of one gate.","TRY AGAIN!"],"items":[],"quiz":null},{"id":"P1910","text":["This completes the information on TTL INTEGRATED CIRCUITS.."],"items":[{"label":"Next","page":"P1001"},{"label":"Back","page":"P1310"}],"quiz":null},{"id":"P1920","text":["1. Transistor-Transistor Logic (TTL) is the most widely used family of integrated circuits."],"items":[{"label":"Next","page":"P1930"},{"label":"Back","page":"P1001"}],"quiz":null},{"id":"P1930","text":["2. The TTL family is divided into two basic groups."],"items":[{"label":"Next","page":"P1940"},{"label":"Back","page":"P1920"}],"quiz":null},{"id":"P1940","text":["3. Input and output voltages for TTL Family ICs range from 0 to 5V."],"items":[{"label":"Next","page":"P1950"},{"label":"Back","page":"P1920"}],"quiz":null},{"id":"P1950","text":["4. Fan-in is a value given to an IC to represent the current it draws from a driven IC."],"items":[{"label":"Next","page":"P1960"},{"label":"Back","page":"P1940"}],"quiz":null},{"id":"P1960","text":["5. Fan-out is a value given to an IC to represent how many ICs, similar to itself, it can drive."],"items":[{"label":"Next","page":"P1970"},{"label":"Back","page":"P1950"}],"quiz":null},{"id":"P1970","text":["6. Speed is measured by propagation delay which is the amount of time an IC takes to switch from one condition to the other."],"items":[{"label":"Next","page":"P1999"},{"label":"Back","page":"P1960"}],"quiz":null},{"id":"P1999","text":["You have completed the Summary. You are about to return to the Objective Menu.."],"items":[{"label":"Next","page":"P1001"},{"label":"Back","page":"P1970"}],"quiz":null},{"id":"P2001","text":["OTHER INTEGRATED CIRCUITS"],"items":[{"label":"Discussion","page":"P2040"},{"label":"Summary","page":"P2910"},{"label":"Back","page":"P20001"}],"quiz":null},{"id":"P2040","text":["TTL is the most widely used family of integrated circuits, however there are many other IC families.","DISCUSSION"],"items":[{"label":"Next","page":"P2050"},{"label":"Back","page":"P2001"}],"quiz":null},{"id":"P2050","text":["Three of the most common are CMOS, ECL and IIL. Let's discuss CMOS first."],"items":[{"label":"Next","page":"P2060"},{"label":"Back","page":"P2040"}],"quiz":null},{"id":"P2060","text":["Complementary MOS (CMOS) is slower than TTL but has a much lower power requirement than TTL."],"items":[{"label":"Next","page":"P2070"},{"label":"Back","page":"P2040"}],"quiz":null},{"id":"P2070","text":["CMOS is constructed from P and N-channel transistors to give the CMOS IC a high input impedance."],"items":[{"label":"Next","page":"P2080"},{"label":"Back","page":"P2040"}],"quiz":null},{"id":"P2075","text":["DEFINITION","IMPEDANCE - Is the total opposition of resistance and reactance to a sine-wave alternating current."],"items":[],"quiz":null},{"id":"P2080","text":["A high input impedance insures that the CMOS IC operates at a low input power."],"items":[{"label":"Next","page":"P2090"},{"label":"Back","page":"P2070"}],"quiz":null},{"id":"P2090","text":["As a technician you can identify a CMOS IC from a TTL IC by the \"C\" in the chip's number."],"items":[{"label":"Next","page":"P2100"},{"label":"Back","page":"P2070"}],"quiz":null},{"id":"P2100","text":["The major difference between TTL and CMOS is that CMOS input/output voltages range from 0 to 15 volts."],"items":[{"label":"Next","page":"P2110"},{"label":"Back","page":"P2070"}],"quiz":null},{"id":"P2110","text":["A major advantage of CMOS over TTL is noise. Almost no switching noise is generated by the CMOS IC."],"items":[{"label":"Next","page":"P2120"},{"label":"Back","page":"P2100"}],"quiz":null},{"id":"P2120","text":["Two other families you may encounter are ECL and IIL......."],"items":[{"label":"Next","page":"P2130"},{"label":"Back","page":"P2100"}],"quiz":null},{"id":"P2130","text":["The ECL family or Emitter-Coupled Logic is used in areas where speed is more important than cost."],"items":[{"label":"Next","page":"P2140"},{"label":"Back","page":"P2120"}],"quiz":null},{"id":"P2140","text":["The ECL Family is recognized most often by 10000 series numbers."],"items":[{"label":"Next","page":"P2150"},{"label":"Back","page":"P2130"}],"quiz":null},{"id":"P2150","text":["The IIL family or Integrated Injection Logic is used in circuits that require analog and digital interaction."],"items":[{"label":"Next","page":"P2160"},{"label":"Back","page":"P2130"}],"quiz":null},{"id":"P2160","text":["The IIL Family is recognized more easily from the manufacturers name than by the number of the IC."],"items":[{"label":"Next","page":"P2170"},{"label":"Back","page":"P2150"}],"quiz":null},{"id":"P2170","text":["There are different families of ICs because some circuits require speed while others require less power."],"items":[{"label":"Next","page":"P2180"},{"label":"Back","page":"P2150"}],"quiz":null},{"id":"P2180","text":["The TTL and IIL Families have an average tradeoff between speed and power."],"items":[{"label":"Next","page":"P2190"},{"label":"Back","page":"P2170"}],"quiz":null},{"id":"P2190","text":["CMOS trades the advantage of a very low power requirement for a disadvantage of a slow switching speed."],"items":[{"label":"Next","page":"P2200"},{"label":"Back","page":"P2170"}],"quiz":null},{"id":"P2200","text":["ECL trades the advantage of a very fast switching speed for the disadvantage of a very high power requirement."],"items":[{"label":"Next","page":"P2210"},{"label":"Back","page":"P2170"}],"quiz":null},{"id":"P2210","text":["IC DATA BOOK","Learn to use the IC data book, technical guide and cross reference manual when replacing a defective IC. Especially if you intend to substitute a replacement IC for the original.nt IC ..........."],"items":[{"label":"Next","page":"P2220"},{"label":"Back","page":"P2170"}],"quiz":null},{"id":"P2220","text":["Replacing a defective 74F00 IC with a 74L00 IC may not repair the circuit, and can cause new problems."],"items":[{"label":"Next","page":"P2230"},{"label":"Back","page":"P2210"}],"quiz":null},{"id":"P2230","text":["Which logic families have similar speed and power requirements?"],"items":[{"label":"Back","page":"P2210"}],"quiz":{"again":"P2232","next":"P2240","choices":[{"label":"TTL and CMOS","correct":false},{"label":"CMOS and ECL","correct":false},{"label":"TTL and IIL","correct":true}]}},{"id":"P2231","text":[],"items":[],"quiz":null},{"id":"P2232","text":["Use the chart below to compare the Logic Families speed and power.","TRY AGAIN!"],"items":[],"quiz":null},{"id":"P2240","text":["Which logic family has the fastest switching time?"],"items":[{"label":"Back","page":"P2230"}],"quiz":{"again":"P2242","next":"P2250","choices":[{"label":"TTL","correct":false},{"label":"CMOS","correct":false},{"label":"ECL","correct":true}]}},{"id":"P2241","text":[],"items":
